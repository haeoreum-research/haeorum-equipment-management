<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
    <!-- Background -->
    <rect width="200" height="80" fill="#ffffff"/>
    
    <!-- Circle with horizontal lines -->
    <circle cx="40" cy="40" r="35" fill="none" stroke="#003d9e" stroke-width="2"/>
    
    <!-- Horizontal lines in circle -->
    <line x1="10" y1="20" x2="70" y2="20" stroke="#003d9e" stroke-width="1.5"/>
    <line x1="8" y1="28" x2="72" y2="28" stroke="#003d9e" stroke-width="1.5"/>
    <line x1="6" y1="36" x2="74" y2="36" stroke="#003d9e" stroke-width="1.5"/>
    <line x1="8" y1="44" x2="72" y2="44" stroke="#003d9e" stroke-width="1.5"/>
    <line x1="10" y1="52" x2="70" y2="52" stroke="#003d9e" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="65" y2="60" stroke="#003d9e" stroke-width="1.5"/>
    
    <!-- Star on top -->
    <g transform="translate(40, 12)">
        <polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2" fill="#003d9e"/>
    </g>
    
    <!-- Text -->
    <text x="110" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000">해오름</text>
    <text x="110" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666666" letter-spacing="2">RESEARCH LAB</text>
</svg>
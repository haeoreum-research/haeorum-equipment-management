<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
    <!-- Left star -->
    <g transform="translate(60, 80)">
        <polygon points="0,-15 3.5,-4 15,-4 6,3 9,15 0,8 -9,15 -6,3 -15,-4 -3.5,-4" fill="#003d9e" stroke="#003d9e" stroke-width="0.5"/>
    </g>
    
    <!-- Main circle with horizontal lines (sunrise/horizon) -->
    <g transform="translate(200, 100)">
        <!-- Circle outline -->
        <circle cx="0" cy="0" r="80" fill="none" stroke="#003d9e" stroke-width="3"/>
        
        <!-- Horizontal lines (representing sun rays/horizon lines) -->
        <line x1="-100" y1="-60" x2="100" y2="-60" stroke="#003d9e" stroke-width="6" stroke-linecap="round"/>
        <line x1="-110" y1="-40" x2="110" y2="-40" stroke="#003d9e" stroke-width="6" stroke-linecap="round"/>
        <line x1="-115" y1="-20" x2="115" y2="-20" stroke="#003d9e" stroke-width="6" stroke-linecap="round"/>
        <line x1="-115" y1="0" x2="115" y2="0" stroke="#003d9e" stroke-width="6" stroke-linecap="round"/>
        <line x1="-110" y1="20" x2="110" y2="20" stroke="#003d9e" stroke-width="6" stroke-linecap="round"/>
        <line x1="-100" y1="40" x2="100" y2="40" stroke="#003d9e" stroke-width="6" stroke-linecap="round"/>
        <line x1="-80" y1="60" x2="80" y2="60" stroke="#003d9e" stroke-width="6" stroke-linecap="round"/>
        
        <!-- Top star/spike -->
        <polygon points="0,-95 4,-75 0,-85 -4,-75" fill="#003d9e" stroke="#003d9e" stroke-width="1"/>
    </g>
    
    <!-- Right star -->
    <g transform="translate(440, 50)">
        <polygon points="0,-10 2.5,-3 10,-3 4,2 6,10 0,5.5 -6,10 -4,2 -10,-3 -2.5,-3" fill="#003d9e" stroke="#003d9e" stroke-width="0.5"/>
    </g>
    
    <!-- Korean text -->
    <text x="520" y="120" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#000000">
        해오름 연구소
    </text>
    
    <!-- English text -->
    <text x="520" y="165" font-family="Arial, sans-serif" font-size="28" font-weight="normal" fill="#000000" letter-spacing="8">
        HAEORUM RESEARCH LAB
    </text>
</svg>